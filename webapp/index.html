<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AI Чат</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-orb"></span>
        <span class="brand-name">AI Чат</span>
      </div>

      <button id="new-chat-btn" class="new-chat-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
          <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
        </svg>
        Новый чат
      </button>

      <ul id="chat-list" class="chat-list"></ul>
    </aside>

    <main class="main">
      <header class="header">
        <div class="header-left">
          <span class="header-orb"></span>
          <div class="header-titles">
            <span class="header-title">AI Чат</span>
            <span class="header-subtitle">Чат с нейросетью</span>
          </div>
        </div>
        <div class="header-actions">
          <button id="sidebar-toggle" class="icon-btn" aria-label="Чаты">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
          </button>
          <button id="close-btn" class="icon-btn" aria-label="Закрыть">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
          </button>
        </div>
      </header>

      <div id="messages" class="messages"></div>

      <form id="message-form" class="message-form">
        <button type="button" id="attach-btn" class="attach-btn" aria-label="Прикрепить файл">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path
              d="M17.5 6.5l-8.4 8.4a2.5 2.5 0 003.5 3.5l8.1-8.1a4.2 4.2 0 00-6-6L6.2 12.8a5.9 5.9 0 008.4 8.4"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <input
          id="message-input"
          type="text"
          placeholder="Напиши сообщение..."
          autocomplete="off"
        />
        <button type="submit" class="send-btn" aria-label="Отправить">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M12 19V5M5 12l7-7 7 7" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </form>

      <p class="disclaimer">AI Чат может ошибаться. Проверяйте важную информацию.</p>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
